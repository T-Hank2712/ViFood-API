# ==============================================================
# Nginx upstream — trỏ tới service "api" trong Docker network
# ==============================================================
upstream vifood_api {
    server api:8000;
    keepalive 32;
}

# ==============================================================
# Server block HTTP (port 80)
# Giai đoạn 1 — chưa có SSL: proxy thẳng vào API
# Giai đoạn 2 — có SSL: redirect 301 sang HTTPS
# ==============================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;    # Nhận mọi domain/IP, đổi thành domain thực khi có

    # ---- Let's Encrypt ACME challenge (dùng khi xin SSL) ----
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- Khi chưa có SSL: proxy trực tiếp vào API ----
    # (comment block này lại và bỏ comment redirect bên dưới khi đã có SSL)
    location / {
        proxy_pass         http://vifood_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- Khi đã có SSL: bật redirect này, tắt location / ở trên ----
    # return 301 https://$host$request_uri;
}

