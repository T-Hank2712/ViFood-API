name: CD

# Trigger: mỗi khi code được push vào develop
# (bao gồm sau khi CI auto-merge PR vào develop)
on:
  push:
    branches:
      - develop

permissions:
  contents: read

# CD KHÔNG cancel-in-progress — nếu đang deploy thì chờ xong
# tránh tình trạng VPS bị ngắt deploy giữa chừng → broken state
concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  # ============================================================
  # JOB 1: Build image và push lên Docker Hub
  # ============================================================
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    outputs:
      # Truyền image tag sang job deploy
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      # ----------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Tạo image tag từ Git SHA (7 ký tự đầu)
      # VD: sha-a1b2c3d  — ngắn gọn, traceable, unique
      # ----------------------------------------------------------
      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image tag: sha-${SHORT_SHA}"

      # ----------------------------------------------------------
      # 3. Buildx — hỗ trợ GHA layer cache
      # ----------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------
      # 4. Đăng nhập Docker Hub
      # DOCKER_USERNAME / DOCKER_PASSWORD lấy từ GitHub Secrets
      # ----------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ----------------------------------------------------------
      # 5. Build và push image với 2 tag:
      #   - sha-a1b2c3d  → version cụ thể, dùng để deploy & rollback
      #   - latest        → luôn trỏ tới bản mới nhất
      # GHA cache giúp layer không bị build lại nếu không thay đổi
      # ----------------------------------------------------------
      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vifood-api:${{ steps.tag.outputs.image_tag }}
            ${{ secrets.DOCKER_USERNAME }}/vifood-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 2: Deploy lên VPS
  # Chạy sau khi build-and-push thành công
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # ----------------------------------------------------------
      # SSH vào VPS và chạy deploy script
      #
      # Flow trên VPS:
      #   1. cd /opt/vifood
      #   2. git pull origin develop  (lấy docker-compose.prod.yml mới nhất)
      #   3. bash scripts/deploy.sh <image_tag> <docker_username>
      #      - Lưu tag hiện tại để rollback
      #      - Pull image mới từ Docker Hub
      #      - docker compose up -d
      #      - Health check /health (60s timeout)
      #      - Nếu fail → tự động rollback về tag cũ
      # ----------------------------------------------------------
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            DEPLOY_DIR="/opt/vifood"
            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"

            echo "=== CD: Deploying ${IMAGE_TAG} ==="

            cd "$DEPLOY_DIR"

            # Lấy docker-compose.prod.yml và scripts mới nhất từ repo
            git pull origin develop

            # Chạy deploy script (tự xử lý health check + rollback)
            bash scripts/deploy.sh "$IMAGE_TAG" "$DOCKER_USERNAME"
